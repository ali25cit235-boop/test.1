name: Fast Linux RDP (Direct MSTSC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Install Desktop Environment & XRDP
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp
        sudo adduser runner xrdp
        echo "xfce4-session" > ~/.xsession
        sudo service xrdp restart

    - name: Set RDP Password
      run: |
        echo "runner:Pass123456!@#" | sudo chpasswd

    - name: Start Serveo RDP Tunnel
      run: |
        echo "=========================================="
        echo "USERNAME     : runner"
        echo "PASSWORD     : Pass123456!@#"
        echo "=========================================="
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 0:localhost:3389 serveo.net
