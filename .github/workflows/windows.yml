name: Windows Fast Performance RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop & Fix Speed
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        net user ali pass123 /add
        net localgroup administrators ali /add

        # Disable Visual Effects & Animations (Speed Boost)
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

    - name: Start Ngrok TCP Tunnel
      run: |
        # Download Ngrok
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/b4Pvu3rtCDy/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."
        
        # Start Ngrok without token (using anonymous guest tcp tunnel)
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -RedirectStandardOutput "ngrok.log"
        Start-Sleep -Seconds 6
        
        # Fetch Address from Ngrok API
        $log = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
        $publicUrl = $log.tunnels[0].public_url -replace "tcp://", ""
        
        Write-Host "=========================================="
        Write-Host "🚀 NGROK FAST RDP READY"
        Write-Host "=========================================="
        Write-Host "CONNECT IP  : $publicUrl"
        Write-Host "USERNAME    : ali"
        Write-Host "PASSWORD    : pass123"
        Write-Host "=========================================="

    - name: Keep Alive Loop
      run: |
        while ($true) {
            Start-Sleep -Seconds 60
        }
