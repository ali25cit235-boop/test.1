name: Windows Fast Performance RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop & Fix Speed
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        net user ali pass123 /add
        net localgroup administrators ali /add

        # Disable Visual Effects & Animations (Speed Boost)
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

    - name: Start Pinggy TCP Tunnel & Show IP
      run: |
        # Install OpenSSH if missing
        if (!(Get-Command ssh -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
        }

        Write-Host "=========================================="
        Write-Host "🚀 STARTING PINGGY TUNNEL (Please wait 5s)..."
        Write-Host "=========================================="

        # Run SSH tunnel in background and capture output directly
        $job = Start-Job -ScriptBlock {
            ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 tcp@a.pinggy.io
        }
        
        Start-Sleep -Seconds 6
        
        # Display Job Output / Connection URL
        Receive-Job -Job $job
        
        Write-Host "=========================================="
        Write-Host "USERNAME    : ali"
        Write-Host "PASSWORD    : pass123"
        Write-Host "=========================================="

    - name: Keep Alive Loop
      run: |
        while ($true) {
            Start-Sleep -Seconds 60
        }
