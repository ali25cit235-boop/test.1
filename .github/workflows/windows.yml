name: Windows 11 RDP (Ngrok High-Speed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop & Optimize Performance
      run: |
        # Enable RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Disable Password Complexity Requirements
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        # Create User "ali" with Password "pass123"
        net user ali pass123 /add
        net localgroup administrators ali /add
        
        # Performance Tuning (Disable Visual Effects for Zero Lag)
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

    - name: Setup & Start Ngrok Tunnel
      run: |
        # Download and install Ngrok via Chocolatey
        choco install ngrok -y
        
        # Authenticate Ngrok
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
        
        # Start Ngrok TCP Tunnel in Background
        Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389"
        
        # Wait for Tunnel to initialize
        Start-Sleep -Seconds 5
        
        # Fetch Connection URL/IP
        $ngrokApi = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
        $tunnelUrl = $ngrokApi.tunnels[0].public_url -replace "tcp://", ""
        
        Write-Host "=========================================="
        Write-Host "🚀 NGROK FAST RDP READY FOR MSTSC"
        Write-Host "=========================================="
        Write-Host "CONNECT IP/PORT : $tunnelUrl"
        Write-Host "USERNAME        : ali"
        Write-Host "PASSWORD        : pass123"
        Write-Host "=========================================="
        
        # Keep Alive Loop for 6 Hours
        while ($true) {
            Start-Sleep -Seconds 60
        }
