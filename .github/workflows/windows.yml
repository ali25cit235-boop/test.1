name: Windows 11 RDP (Bore Tunnel - No Token)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop & Performance Settings
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Bypass Password Policy & Create User
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        net user ali pass123 /add
        net localgroup administrators ali /add
        
        # Disable Visual Effects for Speed
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

    - name: Setup & Run Bore Tunnel
      run: |
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive -Path "bore.zip" -DestinationPath "."
        
        Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore_err.log"
        Start-Sleep -Seconds 5
        
        Write-Host "=========================================="
        Write-Host "🚀 RDP SERVER READY"
        Write-Host "=========================================="
        Get-Content bore.log | Select-String "listening at"
        Write-Host "USERNAME        : ali"
        Write-Host "PASSWORD        : pass123"
        Write-Host "=========================================="
        
        while ($true) {
            Start-Sleep -Seconds 60
        }
