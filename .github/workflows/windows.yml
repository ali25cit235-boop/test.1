name: Windows RDP Free

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        net user ali pass123 /add
        net localgroup administrators ali /add

    - name: Download Cloudflare Tunnel for RDP TCP
      run: |
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "access tcp --url localhost:3389 --hostname rdp.trycloudflare.com" -RedirectStandardOutput "cf.log" -RedirectStandardError "cf_err.log"
        Start-Sleep -Seconds 6

    - name: Show Connection Details
      run: |
        Write-Host "=========================================="
        Write-Host "🚀 RDP IS READY VIA CLOUDFLARE TCP!"
        Write-Host "=========================================="
        Write-Host "HOST: rdp.trycloudflare.com (or check cloudflared output)"
        Write-Host "USERNAME: ali"
        Write-Host "PASSWORD: pass123"
        Write-Host "=========================================="

    - name: Keep Alive
      run: |
        while ($true) {
            Start-Sleep -Seconds 30
        }
