name: Windows Test

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check Windows
        shell: pwsh
        run: |
          Write-Host "Windows Runner Started"
          systeminfo | Select-String "OS Name"
          systeminfo | Select-String "OS Version"

      - name: Check Hardware
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores

          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

      - name: Check PowerShell
        shell: pwsh
        run: |
          $PSVersionTable
