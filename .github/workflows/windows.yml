# Yahan workflow ka naam apna rakh sakte ho (jaise apna naam)
name: WindowsSetup

on:
  workflow_dispatch:
  # Agar 6 hours baad automatically naya wala chahiye to ye uncomment karo (GitHub TOS + minutes limit yaad rakhna)
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  # Yahan job ka naam bhi apna custom rakh sakte ho
  setup:
    runs-on: windows-latest
    steps:
      - name: Ngrok download aur auth
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive -Path ngrok.zip -DestinationPath . -Force
          .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Access configure  # yahan apna naam / custom label use kar sakte ho
        run: |
          # Terminal services enable (registry)
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          # Port allow (firewall rule custom naam)
          netsh advfirewall firewall add rule name="AllowCustomPort" dir=in action=allow protocol=TCP localport=3389
          # User banao — yahan apna username aur password daal sakte ho
          net user MyCustomUser YourStrongPass123 /add
          net localgroup administrators MyCustomUser /add

      - name: Tunnel start aur Discord pe bhejo
        run: |
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 15
          $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $publicUrl = $tunnels.tunnels[0].public_url
          $body = @{
            content = "New details:`nURL: $publicUrl`nUser: MyCustomUser`nPass: YourStrongPass123"
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "${{ secrets.DISCORD_WEBHOOK }}" -Method Post -Body $body -ContentType "application/json"

      - name: Running rakho (lagbhag 6 hours)
        run: Start-Sleep -Seconds 21000
