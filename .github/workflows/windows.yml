name: Windows 11 RDP (LocalXpose Fast Tunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        net user ali pass123 /add
        net localgroup administrators ali /add

    - name: Setup LocalXpose
      run: |
        Invoke-WebRequest -Uri "https://localxpose.io/api/v2/downloads/loclx-windows-amd64.zip" -OutFile "loclx.zip"
        Expand-Archive -Path "loclx.zip" -DestinationPath "."
        
        Start-Process -FilePath ".\loclx.exe" -ArgumentList "tunnel tcp --to 127.0.0.1:3389" -RedirectStandardOutput "loclx.log"
        Start-Sleep -Seconds 6
        
        Write-Host "=========================================="
        Write-Host "🚀 RDP READY"
        Write-Host "=========================================="
        Get-Content loclx.log
        Write-Host "USERNAME        : ali"
        Write-Host "PASSWORD        : pass123"
        Write-Host "=========================================="

    - name: Keep Alive
      run: |
        while ($true) {
            Start-Sleep -Seconds 60
        }
