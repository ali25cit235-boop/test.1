name: Windows Fast Performance RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop & Fix Speed
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        net user ali pass123 /add
        net localgroup administrators ali /add

        # Disable Visual Effects & Animations (Speed Boost)
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

    - name: Start Pinggy TCP Tunnel
      run: |
        # Check and Install OpenSSH if missing
        ssh -V
        if ($LASTEXITCODE -ne 0) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
        }

        # Start Pinggy TCP Tunnel for RDP port 3389
        Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log"
        Start-Sleep -Seconds 8
        
        Write-Host "=========================================="
        Write-Host "🚀 FAST RDP READY"
        Write-Host "=========================================="
        Get-Content pinggy.log
        Get-Content pinggy_err.log
        Write-Host "USERNAME    : ali"
        Write-Host "PASSWORD    : pass123"
        Write-Host "=========================================="

    - name: Keep Alive Loop
      run: |
        while ($true) {
            Start-Sleep -Seconds 60
        }
